version: '3'

services:
  mysql:
    image: mysql:8.0.19
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: db1
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 3
  redis:
    image: redis:5.0.7
    command: redis-server --requirepass 123456
    ports:
      - "16379:6379"
    environment:
      - REDIS_DB=0
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "-p", "6379", "-a", "123456", "ping"]
      interval: 10s
      timeout: 3s
volumes:
  mysql_data: